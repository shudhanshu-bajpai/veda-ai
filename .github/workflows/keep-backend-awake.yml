name: Keep backend awake

# Render's free tier spins down after ~15 min of inactivity.
# This workflow hits /api/health every 10 minutes so the instance stays warm.
#
# It uses a repository variable BACKEND_URL so the URL isn't hard-coded.
# Set it in: GitHub repo → Settings → Secrets and variables → Actions → Variables tab
#   Name : BACKEND_URL
#   Value: https://your-service.onrender.com   (no trailing slash, no /api)

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:          # also allow manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Hit /api/health
        run: |
          URL="${{ vars.BACKEND_URL }}"
          if [ -z "$URL" ]; then
            echo "::error::BACKEND_URL repo variable is not set"
            exit 1
          fi
          echo "Pinging $URL/api/health ..."
          # follow redirects, fail on >=400, allow 60s for cold start
          curl -fSL --max-time 60 "$URL/api/health" || {
            echo "::warning::Health check failed — the backend may still be waking up. Will retry next run."
            exit 0
          }
          echo "Backend is awake."
